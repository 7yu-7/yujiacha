# ============================================================================
# 渔价查 · Docker 编排
# 依据 PRD 3.5：镜像 backend（应用服务）、admin（管理后台 + Nginx）、可选 mysql
#
# 用法：
#   docker compose up -d                    # 启动（使用宿主机 MySQL）
#   docker compose --profile db up -d       # 启动并启用容器化 MySQL
#   docker compose logs -f backend          # 查看日志
#   docker compose down                     # 停止（数据卷保留）
# ============================================================================
version: '3.8'

services:
  # ── 应用服务（统一 REST API，服务四端）─────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: yujiacha/backend:1.0.0
    container_name: yjc-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      # 数据库：默认连宿主机 MySQL；启用 db profile 时改为 mysql
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?请通过环境变量提供数据库密码}
      DB_NAME: ${DB_NAME:-fish_price}
      DB_DRIVER: mysql
      # 密钥：必须由环境变量注入，不写入镜像与代码
      JWT_SECRET: ${JWT_SECRET:?请通过环境变量提供 JWT 密钥}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8787}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      CACHE_TTL: ${CACHE_TTL:-60}
    ports:
      - '${PORT:-8787}:8787'
    volumes:
      # 邮件取件箱与运行时数据
      - yjc-data:/app/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [yjc]

  # ── 管理后台（静态产物 + Nginx，可选独立部署）──────────────────────────
  # 说明：后端已同时托管 /admin 静态资源，本服务用于将管理后台独立到单独域名/端口。
  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      args:
        API_BASE: ${ADMIN_API_BASE:-}
    image: yujiacha/admin:1.0.0
    container_name: yjc-admin
    restart: unless-stopped
    ports:
      - '${ADMIN_PORT:-8080}:80'
    depends_on:
      - backend
    profiles: ['admin']
    networks: [yjc]

  # ── 容器化 MySQL（可选，启用 --profile db）────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: yjc-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请提供 MySQL root 密码}
      MYSQL_DATABASE: ${DB_NAME:-fish_price}
      TZ: Asia/Shanghai
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - yjc-mysql:/var/lib/mysql
      # 首次启动自动建表
      - ../server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ['db']
    networks: [yjc]

  # ── 反向代理（可选，统一入口 + HTTPS 卸载）──────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: yjc-nginx
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-80}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 时将证书目录挂载进来：
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    profiles: ['proxy']
    networks: [yjc]

volumes:
  yjc-data:
    driver: local
  yjc-mysql:
    driver: local

networks:
  yjc:
    driver: bridge
