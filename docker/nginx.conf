# ============================================================================
# 渔价查 · 反向代理配置（统一入口）
# 生产环境建议启用 HTTPS，并将 HTTP 跳转到 HTTPS
# ============================================================================
upstream yjc_backend {
    server backend:8787;
    keepalive 32;
}

# 限流：保护登录与阈值扫描等写接口
limit_req_zone $binary_remote_addr zone=yc_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=yc_auth:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 4m;

    # 安全响应头
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # ── 认证接口：更严格限流，防暴力破解 ──────────────────────────────
    location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=yc_auth burst=10 nodelay;
        proxy_pass http://yjc_backend;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # ── 全部 API ──────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=yc_api burst=60 nodelay;
        proxy_pass http://yjc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── 静态资源与四端入口 ────────────────────────────────────────────
    location / {
        proxy_pass http://yjc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 缓存策略：带 hash 的静态资源长缓存，HTML 不缓存 ───────────────
    location ~* \.(css|js|svg|png|jpe?g|webp|woff2?|ttf)$ {
        proxy_pass http://yjc_backend;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html?$ {
        proxy_pass http://yjc_backend;
        add_header Cache-Control "no-cache";
    }
}

